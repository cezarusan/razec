function parseFrame(frame, type) {
  const fields = frame.schema.fields;
  const values = frame.data.values;
  const rows = [];
  const n = values[0]?.length || 0;
  for (let i = 0; i < n; i++) {
    const raw = {};
    fields.forEach((f, j) => { raw[f.name] = values[j][i]; });

    // DataInicio pode vir como timestamp ms — converte para string de hora
    let hora = raw['Ultimo_apontamento'] || '';
    if (typeof hora !== 'string') hora = String(hora);
    hora = hora.substring(0, 8); // garante HH:MM:SS

    const row = {
      hora,
      op:  Number(raw['Operador']),
      cx:  raw['CodigoCaixa'] || '',
      pi:  Number(raw['PesoInicial'])  || 0,
      pf:  Number(raw['PesoFinal'])    || 0,
      res: Number(raw['PesoResiduo'])  || 0,
    };
    if (type === 'FIL') row.lote = raw['Lote'] || '';
    rows.push(row);
  }
  return rows;
}

async function queryGrafana(sql, dtDe, dtAte) {
  const from = new Date(dtDe + 'T00:00:00').getTime();
  const to   = new Date(dtAte + 'T23:59:59').getTime();

  const res = await fetch(`${GRAFANA_URL}/api/ds/query`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': GRAFANA_AUTH,
    },
    body: JSON.stringify({
      queries: [{
        datasource: {type:'mssql', uid: DS_UID},
        rawSql: sql,
        format: 'table',
        refId: 'A',
        rawQuery: true,
        dataset: 'ERP',
      }],
      from: String(from),
      to:   String(to),
    }),
  });

  if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  const json = await res.json();
  const frame = json?.results?.A?.frames?.[0];
  if (!frame) throw new Error('Resposta inesperada do Grafana');
  return frame;
}

  try {
    const [frameFil, frameRef] = await Promise.all([
      queryGrafana(SQL_FIL, dtDe, dtAte),
      queryGrafana(SQL_REF, dtDe, dtAte),
    ]);
    FIL = parseFrame(frameFil, 'FIL');
    REF = parseFrame(frameRef, 'REF');
    dataSource = 'grafana';
    setStatus(`Conectado ao Grafana · ${FIL.length + REF.length} registros`, 'ok');
  } catch (e) {
    // fallback para dados locais
    FIL = [...FIL_FALLBACK];
    REF = [...REF_FALLBACK];
    dataSource = 'fallback';
    const msg = e.message.includes('Failed to fetch')
      ? 'Sem acesso à rede local (CORS?) — dados de exemplo'
      : `Erro: ${e.message} — dados de exemplo`;
    setStatus(msg, 'erro');
  } finally {
    document.getElementById('btn-atualizar').disabled = false;
  }

  populateFilters();
  render();
}

/* ── HELPERS ── */

function toMins(h) {
  const [hh, mm, ss] = h.split(':').map(Number);
  return hh * 60 + mm + (ss || 0) / 60;
}
function rend(r, type) {
  return type === 'FIL'
    ? (r.pf / (r.pi - r.res)) * 100
    : ((r.pf + r.res) / r.pi) * 100;
}
function fmtKg(v) {
  return v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' kg';
}
function fmtPct(v) {
  return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
}
function fmtMins(m) {
  if (m < 60) return m.toFixed(1) + 'min';
  return (m/60).toFixed(1) + 'h';
}

function opStats(rows, type) {
  const byOp = {};
  rows.forEach(r => {
    if (!byOp[r.op]) byOp[r.op] = [];
    byOp[r.op].push({...r, rd: rend(r, type), mins: toMins(r.hora)});
  });
  return Object.entries(byOp).map(([op, cx]) => {
    cx.sort((a,b) => a.mins - b.mins);
    const n = cx.length;
    const sumPi = cx.reduce((s,r)=>s+r.pi, 0);
    const sumPf = cx.reduce((s,r)=>s+r.pf, 0);
    const sumRes = cx.reduce((s,r)=>s+r.res, 0);
    const avgRd = cx.reduce((s,r)=>s+r.rd, 0) / n;
    let intvlSum = 0;
    for (let i=1;i<n;i++) intvlSum += cx[i].mins - cx[i-1].mins;
    const avgIntvl = n > 1 ? intvlSum / (n-1) : 0;
    const span = cx[n-1].mins - cx[0].mins;
    const cxh = span > 0 ? (n / (span/60)) : 0;
    return {op:Number(op), caixas:n, sumPi, sumPf, sumRes, avgRd, avgIntvl, cxh,
            firstHora:cx[0].hora, lastHora:cx[n-1].hora};
  });
}

function globalStats(rows, type) {
  const sumPi  = rows.reduce((s,r)=>s+r.pi, 0);
  const sumPf  = rows.reduce((s,r)=>s+r.pf, 0);
  const sumRes = rows.reduce((s,r)=>s+r.res, 0);
  const ovRd   = type==='FIL' ? (sumPf/(sumPi-sumRes))*100 : ((sumPf+sumRes)/sumPi)*100;
  const ops    = [...new Set(rows.map(r=>r.op))].length;
  const sorted = [...rows].sort((a,b)=>toMins(a.hora)-toMins(b.hora));
  let iSum=0;
  for(let i=1;i<sorted.length;i++) iSum+=toMins(sorted[i].hora)-toMins(sorted[i-1].hora);
  const avgI   = sorted.length>1 ? iSum/(sorted.length-1) : 0;
  const span   = toMins(sorted[sorted.length-1].hora)-toMins(sorted[0].hora);
  const cxh    = span>0 ? rows.length/(span/60) : 0;
  return {total:rows.length, ops, sumPi, sumPf, sumRes, ovRd, avgI, cxh};
}

/* ── SETOR TOGGLE ── */
function setSetor(s) {
  setor = s;
  document.getElementById('tab-fil').className = 'tab' + (s==='FIL' ? ' active-fil' : '');
  document.getElementById('tab-ref').className = 'tab' + (s==='REF' ? ' active-ref' : '');
  document.getElementById('brand-sec').textContent = s==='FIL' ? 'Filetagem' : 'Refile';
  document.getElementById('brand-sec').style.color = s==='FIL' ? 'var(--orange)' : 'var(--cyan)';
  document.getElementById('lote-label').style.opacity = s==='FIL' ? '1' : '.4';
  populateFilters();
  render();
}

function refresh() { fetchData(); }

/* ── FILTROS ── */
function populateFilters() {
  const rows = setor==='FIL' ? FIL : REF;
  const opSel = document.getElementById('sel-op');
  const opVal = opSel.value;
  opSel.innerHTML = '<option value="">Todos</option>';
  [...new Set(rows.map(r=>r.op))].sort().forEach(op => {
    const o = document.createElement('option');
    o.value = op; o.textContent = `Op. ${op} — ${OPS[op]?.name||op}`;
    if (String(op)===opVal) o.selected = true;
    opSel.appendChild(o);
  });

  const loteSel = document.getElementById('sel-lote');
  const loteVal = loteSel.value;
  loteSel.innerHTML = '<option value="">Todos</option>';
  if (setor==='FIL') {
    [...new Set(FIL.map(r=>r.lote))].sort().forEach(l => {
      const o = document.createElement('option');
      o.value = l; o.textContent = l;
      if (l===loteVal) o.selected = true;
      loteSel.appendChild(o);
    });
  }
  loteSel.disabled = setor!=='FIL';
}

/* ── RENDER ── */
function render() {
  const rawRows = setor==='FIL' ? FIL : REF;
  const opFilter   = document.getElementById('sel-op').value;
  const loteFilter = document.getElementById('sel-lote').value;
  const sortBy     = document.getElementById('sel-sort').value;

  let rows = rawRows.filter(r => {
    if (opFilter && String(r.op)!==opFilter) return false;
    if (loteFilter && r.lote!==loteFilter) return false;
    return true;
  });

  document.getElementById('top-count').textContent = rows.length;

  const gs = globalStats(rows, setor);
  renderKPI(gs, rows, setor);

  const stats = opStats(rows, setor);
  const sorted = [...stats].sort((a,b)=>{
    if (sortBy==='rend')     return b.avgRd - a.avgRd;
    if (sortBy==='cxhora')   return b.cxh - a.cxh;
    if (sortBy==='kgentrada')return b.sumPi - a.sumPi;
    return b.caixas - a.caixas;
  });

  const maxRd = Math.max(...sorted.map(s=>s.avgRd));
  const minRd = Math.min(...sorted.map(s=>s.avgRd));
  const p75rd = sorted.length ? sorted[Math.floor(sorted.length*0.25)].avgRd : 0;
  const p25rd = sorted.length ? sorted[Math.floor(sorted.length*0.75)].avgRd : 0;

  document.getElementById('ranking-count').textContent = `${sorted.length} operador${sorted.length!==1?'es':''}`;

  const grid = document.getElementById('op-grid');
  if (!sorted.length) { grid.innerHTML='<div class="empty">Nenhum dado para o filtro selecionado.</div>'; return; }

  grid.innerHTML = sorted.map((s, i) => {
    const op = OPS[s.op] || {name:`Op. ${s.op}`, color:'#78909c'};
    const col = op.color;
    const ritmo = s.avgRd >= p75rd ? 'otimo' : s.avgRd <= p25rd ? 'baixo' : 'medio';
    const rlabel = ritmo==='otimo'?'✓ Ritmo ótimo':ritmo==='medio'?'⚡ Ritmo médio':'↓ Ritmo baixo';
    const pct = maxRd > minRd ? ((s.avgRd - minRd)/(maxRd - minRd))*100 : 50;
    return `
    <div class="op-card" style="--c:${col}">
      <div class="op-card-head">
        <div class="op-info">
          <div class="op-code">Op. ${s.op}</div>
          <div class="op-name">${op.name}</div>
        </div>
        <div class="op-rank">#${i+1}</div>
      </div>
      <div class="op-body">
        <div class="op-k">Caixas</div>        <div class="op-v">${s.caixas}</div>
        <div class="op-k">Rend. médio</div>   <div class="op-v rend-v">${fmtPct(s.avgRd)}</div>
        <div class="op-k">Intervalo</div>     <div class="op-v">${fmtMins(s.avgIntvl)}</div>
        <div class="op-k">Cx/Hora</div>       <div class="op-v">${s.cxh.toFixed(1)}</div>
        <div class="op-k">Kg entrada</div>    <div class="op-v">${fmtKg(s.sumPi)}</div>
        <div class="op-k">Kg saída</div>      <div class="op-v">${fmtKg(s.sumPf)}</div>
        <div class="op-k">Resíduo</div>       <div class="op-v">${fmtKg(s.sumRes)}</div>
        <div class="op-k">Últ. apont.</div>   <div class="op-v">${s.lastHora}</div>
      </div>
      <div class="op-footer">
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct.toFixed(1)}%"></div></div>
          <span class="progress-pct">${fmtPct(s.avgRd)}</span>
        </div>
        <span class="badge badge-${ritmo}">${rlabel}</span>
      </div>
    </div>`;
  }).join('');
}

function renderKPI(gs, rows, type) {
  // best operator
  const stats = opStats(rows, type);
  const best = stats.length ? [...stats].sort((a,b)=>b.avgRd-a.avgRd)[0] : null;

  const strip = document.getElementById('kpi-strip');
  const kpis = [
    {label:'Total Caixas', val:`<span class="kv-blue" style="font-size:28px">${gs.total}</span>`, sub:'caixas'},
    {label:'Operadores', val:`<span class="kv-purple" style="font-size:28px">${gs.ops}</span>`, sub:'ativos'},
    {label:'Peso Entrada', val:`<span class="kv-blue">${fmtKg(gs.sumPi)}</span>`, sub:'total bruto'},
    {label:'Peso Saída', val:`<span class="kv-orange">${fmtKg(gs.sumPf)}</span>`, sub:'total líquido'},
    {label:'Resíduo', val:`<span class="kv-cyan">${fmtKg(gs.sumRes)}</span>`, sub:'total'},
    {label:'Rendimento', val:`<span class="kv-yellow">${fmtPct(gs.ovRd)}</span>`, sub:'geral'},
    {label:'Intervalo Médio', val:`<span class="kv-orange">${fmtMins(gs.avgI)}</span>`, sub:'entre caixas'},
    {label:'Cx/Hora Médio', val:`<span class="kv-blue">${gs.cxh.toFixed(1)}</span>`, sub:'cxs/h'},
    best ? {label:'Melhor Op.', val:`<div class="kpi-best"><div class="kpi-best-op">Op. ${best.op}</div><div class="kpi-best-rend">${fmtPct(best.avgRd)} rend.</div></div>`, sub:OPS[best.op]?.name||''} : null,
  ].filter(Boolean);

  strip.innerHTML = kpis.map(k=>`
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      ${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ''}
    </div>`).join('');
}

/* ── INIT ── */
populateFilters();
render();
fetchData(); // tenta buscar dados reais do Grafana
</script>
