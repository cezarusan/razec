<title>Apontamentos Geral — Filetagem e Refile</title>
<style>
:root {
  --bg:      #0d1117;
  --surf:    #131b24;
  --surf2:   #192330;
  --surf3:   #1f2c3a;
  --bdr:     #1e2d3f;
  --bdr2:    #26394f;
  --txt:     #ccd6e0;
  --txt2:    #6e8ca8;
  --txt3:    #384f63;
  --cyan:    #00bcd4;
  --orange:  #ff8f00;
  --yellow:  #ffc107;
  --blue:    #2196f3;
  --green:   #4caf50;
  --purple:  #9c27b0;
  --red:     #f44336;
  --silver:  #607d8b;
  --teal:    #009688;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;overflow-x:hidden}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:46px;background:var(--surf);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:50;flex-shrink:0}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand-co{color:var(--cyan)}
.brand-sec{color:var(--orange)}
.top-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt2);white-space:nowrap}
.top-meta .sep{color:var(--bdr2)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:blink 2s ease-in-out infinite;margin-right:3px;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.live-label{color:var(--green);font-weight:500}
.top-spacer{flex:1}
.top-actions{display:flex;gap:6px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:4px;border:none;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.03em;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-green{background:#1b5e20;color:#a5d6a7;border:1px solid #2e7d32}
.btn-orange{background:#e65100;color:#ffccbc;border:1px solid #bf360c}
.btn-gray{background:var(--surf2);color:var(--txt2);border:1px solid var(--bdr2)}

/* ── FILTERBAR ── */
.filterbar{display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--surf2);border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.filter-label{font-size:10px;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.tab-group{display:flex;border:1px solid var(--bdr2);border-radius:4px;overflow:hidden}
.tab{padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--txt2);letter-spacing:.02em;transition:background .15s,color .15s}
.tab.active-fil{background:#0d3a5c;color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.tab.active-ref{background:#3e1a00;color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.tab:not(.active-fil):not(.active-ref):hover{background:var(--surf3);color:var(--txt)}
.filter-sep{width:1px;height:20px;background:var(--bdr2)}
.fselect{background:var(--surf3);border:1px solid var(--bdr2);color:var(--txt);border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer}
.fselect:focus{outline:1px solid var(--cyan)}

/* ── KPI STRIP ── */
.kpi-strip{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--bdr);scrollbar-width:none;background:var(--bg)}
.kpi-strip::-webkit-scrollbar{display:none}
.kpi{flex-shrink:0;padding:9px 16px 9px 14px;min-width:88px;background:var(--surf);border:1px solid var(--bdr2);border-radius:5px}
.kpi-label{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);font-weight:600;white-space:nowrap;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:10px;color:var(--txt3);margin-top:3px}
.kv-blue   {color:var(--blue)}
.kv-cyan   {color:var(--cyan)}
.kv-orange {color:var(--orange)}
.kv-yellow {color:var(--yellow)}
.kv-green  {color:var(--green)}
.kv-purple {color:var(--purple)}
.kpi-best{display:flex;flex-direction:column;gap:2px}
.kpi-best-op{font-size:18px;font-weight:700;color:var(--orange)}
.kpi-best-rend{font-size:11px;color:var(--txt2)}

/* ── CHART ── */
.chart-section{padding:0 16px 12px;border-bottom:1px solid var(--bdr);background:var(--bg)}
.chart-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;flex-wrap:wrap;gap:8px}
.chart-title{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3)}
.chart-legend{display:flex;align-items:center;gap:16px;font-size:10px;color:var(--txt3)}
.chart-legend-item{display:flex;align-items:center;gap:6px}
.meta-dash{width:16px;height:0;border-top:2px dashed var(--yellow);display:inline-block}
.above-dot{width:8px;height:8px;border-radius:2px;background:#4caf50;display:inline-block}
.below-dot{width:8px;height:8px;border-radius:2px;background:#f44336;display:inline-block}
#rend-chart{display:block;border-radius:4px}

/* ── ALERT PILL ── */
.alert-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.02em;white-space:nowrap;line-height:1.6}
.alert-ok  {background:#1b4020;color:#69f0ae;border:1px solid #2e7d32}
.alert-warn{background:#3e2800;color:#ffb300;border:1px solid #e65100}
.alert-crit{background:#3b0f0f;color:#ff5252;border:1px solid #c62828;animation:pulse-red 1.5s ease-in-out infinite}
@keyframes pulse-red{0%,100%{box-shadow:none}50%{box-shadow:0 0 8px rgba(244,67,54,.55)}}

/* ── TREND ── */
.trend-up  {color:#4caf50;font-weight:700;font-size:12px}
.trend-down{color:#f44336;font-weight:700;font-size:12px}
.trend-stab{color:#6e8ca8;font-size:12px}

/* ── RANKING ── */
.ranking-section{padding:12px 16px}
.ranking-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ranking-title{font-size:13px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.ranking-title .trophy{font-size:14px}
.ranking-count{font-size:11px;color:var(--txt3)}
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}

/* ── OP CARD ── */
.op-card{background:var(--surf);border:1px solid var(--bdr);border-top:2px solid var(--c,#fff);border-radius:6px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.op-card-head{padding:9px 12px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.op-info{min-width:0}
.op-code{font-size:11px;font-weight:600;color:var(--c,#fff);letter-spacing:.04em;opacity:.85}
.op-name{font-size:14px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-rank{font-size:10px;font-weight:700;color:var(--txt3);background:var(--surf3);border:1px solid var(--bdr2);border-radius:3px;padding:2px 6px;white-space:nowrap}
.op-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.op-body{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.op-k{font-size:10px;color:var(--txt3);align-self:center}
.op-v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--txt);text-align:right;align-self:center}
.op-v.rend-v{color:var(--c,#fff)}
.op-footer{padding:7px 12px 9px;border-top:1px solid var(--bdr)}
.progress-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.progress-bar{flex:1;height:5px;background:var(--surf3);border-radius:3px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease}
.fill-ok  {background:#4caf50}
.fill-warn{background:#ff8f00}
.fill-low {background:#f44336}
.progress-pct{font-size:10px;color:var(--txt2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:44px;text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px;letter-spacing:.04em}
.badge-otimo{background:#1b4020;color:#69f0ae;border:1px solid #2e7d32}
.badge-medio{background:#3e2800;color:#ffb300;border:1px solid #e65100}
.badge-baixo{background:#3b0f0f;color:#ff8a80;border:1px solid #c62828}

/* ── EMPTY ── */
.empty{padding:40px;text-align:center;color:var(--txt3);font-size:12px}

/* ── THEME (force dark) ── */

/* ── STATUS ── */
function setStatus(msg, tipo) {
  const el  = document.getElementById('live-status');
  const dot = document.getElementById('live-dot');
  const colors = {ok:'#4caf50', erro:'#f44336', carregando:'#ffc107'};

  if (dot) dot.style.background = colors[tipo] || '#6e8ca8';

/* ── PARSE ── */
function parseFrame(frame, type) {
  const fields = frame.schema.fields;
  const values = frame.data.values;
  const rows = [];
  const n = values[0]?.length || 0;
  for (let i = 0; i < n; i++) {
    const raw = {};
    fields.forEach((f, j) => { raw[f.name] = values[j][i]; });
    let hora = raw['Ultimo_apontamento'] || '';
    if (typeof hora !== 'string') hora = String(hora);
    hora = hora.substring(0, 8);
    const row = {
      hora,
      op:  Number(raw['Operador']),
      cx:  raw['CodigoCaixa'] || '',
      pi:  Number(raw['PesoInicial'])  || 0,
      pf:  Number(raw['PesoFinal'])    || 0,
      res: Number(raw['PesoResiduo'])  || 0,
    };
    if (type === 'FIL') row.lote = raw['Lote'] || '';
    rows.push(row);
  }
  return rows;
}

/* ── QUERY ── */
async function queryGrafana(sql, dtDe, dtAte) {
  const from = new Date(dtDe + 'T00:00:00').getTime();
  const to   = new Date(dtAte + 'T23:59:59').getTime();
  const res  = await fetch(`${GRAFANA_URL}/api/ds/query`, {
    method: 'POST',
    headers: {'Content-Type':'application/json','Authorization':GRAFANA_AUTH},
    body: JSON.stringify({
      queries: [{datasource:{type:'mssql',uid:DS_UID},rawSql:sql,format:'table',refId:'A',rawQuery:true,dataset:'ERP'}],
      from: String(from), to: String(to),
    }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  const json = await res.json();
  const frame = json?.results?.A?.frames?.[0];
  if (!frame) throw new Error('Resposta inesperada do Grafana');
  return frame;
}

function startAutoRefresh() {
  stopAutoRefresh();

/* ── FETCH ── */
async function fetchData() {
  const dtDe = document.getElementById('dt-de').value;
  const dtAte = document.getElementById('dt-ate').value;
  setStatus('Carregando...', 'carregando');
  document.getElementById('btn-atualizar').disabled = true;
  try {
    const [frameFil, frameRef] = await Promise.all([
      queryGrafana(SQL_FIL, dtDe, dtAte),
      queryGrafana(SQL_REF, dtDe, dtAte),
    ]);
    FIL = parseFrame(frameFil, 'FIL');
    REF = parseFrame(frameRef, 'REF');
    dataSource = 'grafana';
    const now = new Date().toLocaleTimeString('pt-BR');
    setStatus(`Conectado ao Grafana · ${FIL.length + REF.length} registros · ${now}`, 'ok');
  } catch (e) {
    FIL = [...FIL_FALLBACK];
    REF = [...REF_FALLBACK];

    const msg = e.message.includes('Failed to fetch')
      ? 'Sem acesso a rede local -- execute scripts/proxy.py'
      : `Erro: ${e.message} -- dados de exemplo`;
    setStatus(msg, 'erro');
  } finally {
    document.getElementById('btn-atualizar').disabled = false;
  }
  populateFilters();
  render();
}

/* ── HELPERS ── */
function toMins(h) {
  if (!h || typeof h !== 'string') return 0;
  const [hh, mm, ss] = h.split(':').map(Number);
  return (hh||0)*60 + (mm||0) + (ss||0)/60;
}
function rend(r, type) {
  return type === 'FIL'
    ? (r.pf / Math.max(0.01, r.pi - r.res)) * 100
    : ((r.pf + r.res) / Math.max(0.01, r.pi)) * 100;
}
function fmtKg(v)  { return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg'; }
function fmtPct(v) { return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'; }
function fmtMins(m){ return m < 60 ? m.toFixed(1)+'min' : (m/60).toFixed(1)+'h'; }

/* ── OP STATS (inclui trend e lag) ── */
function opStats(rows, type) {
  const byOp = {};
  rows.forEach(r => {
    if (!byOp[r.op]) byOp[r.op] = [];
    byOp[r.op].push({...r, rd: rend(r, type), mins: toMins(r.hora)});
  });
  return Object.entries(byOp).map(([op, cx]) => {
    cx.sort((a,b) => a.mins - b.mins);
    const n      = cx.length;
    const sumPi  = cx.reduce((s,r)=>s+r.pi, 0);
    const sumPf  = cx.reduce((s,r)=>s+r.pf, 0);
    const sumRes = cx.reduce((s,r)=>s+r.res, 0);
    const avgRd  = cx.reduce((s,r)=>s+r.rd, 0) / n;
    let intvlSum = 0;
    for (let i=1;i<n;i++) intvlSum += cx[i].mins - cx[i-1].mins;
    const avgIntvl = n>1 ? intvlSum/(n-1) : 0;
    const span     = cx[n-1].mins - cx[0].mins;
    const cxh      = span>0 ? (n/(span/60)) : 0;

    /* tendencia: compara primeira metade vs segunda metade do turno */
    let trend = 'n/a';
    if (n >= 4) {
      const mid    = Math.floor(n/2);
      const rdFirst = cx.slice(0,mid).reduce((s,r)=>s+r.rd,0)/mid;
      const rdLast  = cx.slice(mid).reduce((s,r)=>s+r.rd,0)/(n-mid);
      const diff    = rdLast - rdFirst;
      trend = diff > 1.5 ? 'up' : diff < -1.5 ? 'down' : 'stable';
    }

    return {op:Number(op), caixas:n, sumPi, sumPf, sumRes, avgRd, avgIntvl, cxh,
            firstHora:cx[0].hora, lastHora:cx[n-1].hora, trend};
  });
}

function globalStats(rows, type) {
  const sumPi  = rows.reduce((s,r)=>s+r.pi, 0);
  const sumPf  = rows.reduce((s,r)=>s+r.pf, 0);
  const sumRes = rows.reduce((s,r)=>s+r.res, 0);
  const ovRd   = type==='FIL' ? (sumPf/Math.max(.01,sumPi-sumRes))*100 : ((sumPf+sumRes)/Math.max(.01,sumPi))*100;
  const ops    = [...new Set(rows.map(r=>r.op))].length;
  const sorted = [...rows].sort((a,b)=>toMins(a.hora)-toMins(b.hora));
  let iSum=0;
  for(let i=1;i<sorted.length;i++) iSum+=toMins(sorted[i].hora)-toMins(sorted[i-1].hora);
  const avgI = sorted.length>1 ? iSum/(sorted.length-1) : 0;
  const span  = sorted.length>1 ? toMins(sorted[sorted.length-1].hora)-toMins(sorted[0].hora) : 0;
  const cxh   = span>0 ? rows.length/(span/60) : 0;
  return {total:rows.length, ops, sumPi, sumPf, sumRes, ovRd, avgI, cxh};
}

/* ── RENDER CHART (canvas) ── */
function renderChart(sorted, type, meta) {
  const section = document.getElementById('chart-section');
  const canvas  = document.getElementById('rend-chart');
  if (!sorted.length || !canvas) { section.style.display='none'; return; }
  section.style.display = 'block';

  const dpr   = window.devicePixelRatio || 1;
  const cssW  = section.clientWidth - 32;
  const ROW   = 32;
  const PAD   = {top:20, right:76, bottom:24, left:138};
  const cssH  = sorted.length * ROW + PAD.top + PAD.bottom;

  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const vals = sorted.map(s=>s.avgRd);
  const xMin = Math.max(0, Math.floor(Math.min(...vals, meta)) - 3);
  const xMax = Math.ceil(Math.max(...vals, meta)) + 5;
  const plotW = cssW - PAD.left - PAD.right;
  const xS = v => PAD.left + (v - xMin) / (xMax - xMin) * plotW;

  /* background */
  ctx.fillStyle = '#131b24';
  ctx.fillRect(0, 0, cssW, cssH);

  /* grid */
  const step = Math.max(1, Math.ceil((xMax - xMin) / 5));
  for (let v = Math.ceil(xMin/step)*step; v <= xMax; v += step) {
    const x = xS(v);
    ctx.strokeStyle = '#1e2d3f'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, cssH-PAD.bottom); ctx.stroke();
    ctx.fillStyle = '#384f63';
    ctx.font = '9px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(v+'%', x, cssH - PAD.bottom + 14);
  }

  /* bars */
  sorted.forEach((s, i) => {
    const op   = OPS[s.op] || {name:`Op.${s.op}`, color:'#78909c'};
    const barY = PAD.top + i*ROW + 5;
    const barH = ROW - 10;
    const x0   = xS(xMin);
    const barW = Math.max(2, xS(s.avgRd) - x0);
    const above = s.avgRd >= meta;

    /* track */
    ctx.fillStyle = 'rgba(30,45,63,0.7)';
    ctx.fillRect(PAD.left, barY, plotW, barH);

    /* fill */
    ctx.save();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = above ? '#4caf50' : '#f44336';
    ctx.fillRect(x0, barY, barW, barH);
    /* color accent stripe */
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = op.color;
    ctx.fillRect(x0, barY, barW, barH);
    ctx.restore();

    /* name */
    const name = op.name.length > 19 ? op.name.slice(0,18)+'…' : op.name;
    ctx.fillStyle = '#ccd6e0';
    ctx.font = '11px system-ui,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(name, PAD.left - 8, barY + barH/2 + 4);

    /* value */
    ctx.fillStyle = above ? '#69f0ae' : '#ff8a80';
    ctx.font = 'bold 11px system-ui,sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(s.avgRd.toFixed(1)+'%', PAD.left + plotW + 7, barY + barH/2 + 4);
  });

  /* meta line */
  const mx = xS(meta);
  ctx.strokeStyle = '#ffc107'; ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(mx, PAD.top - 4); ctx.lineTo(mx, cssH - PAD.bottom); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffc107';
  ctx.font = 'bold 9px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('META', mx, PAD.top - 7);
}

/* ── EXPORT CSV ── */
function exportCSV() {
  const rows = setor==='FIL' ? FIL : REF;
  if (!rows.length) return;
  const hdr = setor==='FIL'
    ? ['Hora','Lote','Operador','Nome','Caixa','Kg Entrada','Kg Saida','Residuo','Rendimento %']
    : ['Hora','Operador','Nome','Caixa','Kg Entrada','Kg Saida','Residuo','Rendimento %'];
  const lines = [hdr.join(';')];
  rows.forEach(r => {
    const rd   = rend(r, setor).toFixed(2);
    const nome = OPS[r.op]?.name || r.op;
    const line = setor==='FIL'
      ? [r.hora,r.lote,r.op,nome,r.cx,r.pi.toFixed(1),r.pf.toFixed(1),r.res.toFixed(1),rd]
      : [r.hora,r.op,nome,r.cx,r.pi.toFixed(1),r.pf.toFixed(1),r.res.toFixed(1),rd];
    lines.push(line.join(';'));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `apontamentos-${setor.toLowerCase()}-${TODAY}.csv`
  });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function populateFilters() {
  const rows = setor==='FIL' ? FIL : REF;

  const opVal = opSel.value;
  opSel.innerHTML = '<option value="">Todos</option>';

/* ── RENDER ── */
function render() {
  const rawRows    = setor==='FIL' ? FIL : REF;
  const opFilter   = document.getElementById('sel-op').value;
  const loteFilter = document.getElementById('sel-lote').value;
  const sortBy     = document.getElementById('sel-sort').value;
  const meta       = Number(document.getElementById('inp-meta').value) || META_DEFAULT[setor];

  let rows = rawRows.filter(r => {
    if (opFilter   && String(r.op)!==opFilter)   return false;
    if (loteFilter && r.lote!==loteFilter)         return false;
    return true;
  });

  document.getElementById('top-count').textContent = rows.length;
  const gs = globalStats(rows, setor);
  renderKPI(gs, rows, setor, meta);

  const stats  = opStats(rows, setor);
  const sorted = [...stats].sort((a,b)=>{
    if (sortBy==='rend')      return b.avgRd - a.avgRd;
    if (sortBy==='cxhora')    return b.cxh   - a.cxh;
    if (sortBy==='kgentrada') return b.sumPi  - a.sumPi;
    return b.caixas - a.caixas;
  });

  /* lag relativo ao operador mais recente no dataset */
  const maxLastMins = sorted.length ? Math.max(...sorted.map(s=>toMins(s.lastHora))) : 0;

  document.getElementById('ranking-count').textContent =
    `${sorted.length} operador${sorted.length!==1?'es':''}`;

  renderChart(sorted, setor, meta);

  const grid = document.getElementById('op-grid');
  if (!sorted.length) {
    grid.innerHTML = '<div class="empty">Nenhum dado para o filtro selecionado.</div>';
    return;
  }

  grid.innerHTML = sorted.map((s, i) => {
    const op  = OPS[s.op] || {name:`Op. ${s.op}`, color:'#78909c'};
    const col = op.color;

    /* alerta de inatividade */
    const lagMins = maxLastMins - toMins(s.lastHora);
    let alertCls, alertLabel;
    if      (lagMins <= 5)  { alertCls='alert-ok';   alertLabel='Ativo'; }
    else if (lagMins <= 30) { alertCls='alert-ok';   alertLabel=`Ha ${Math.round(lagMins)}min`; }
    else if (lagMins <= 60) { alertCls='alert-warn'; alertLabel=`Ha ${Math.round(lagMins)}min`; }
    else                    { alertCls='alert-crit'; alertLabel=`Ha ${(lagMins/60).toFixed(1)}h`; }

    /* tendencia */
    const trendSymbol = s.trend==='up' ? '↑' : s.trend==='down' ? '↓' : '→';
    const trendCls    = s.trend==='up' ? 'trend-up' : s.trend==='down' ? 'trend-down' : 'trend-stab';

    /* progresso vs meta */
    const pct     = Math.min(100, (s.avgRd / meta) * 100);
    const fillCls = s.avgRd >= meta ? 'fill-ok' : s.avgRd >= meta*0.92 ? 'fill-warn' : 'fill-low';
    const ritmo   = s.avgRd >= meta ? 'otimo' : s.avgRd >= meta*0.92 ? 'medio' : 'baixo';
    const rlabel  = ritmo==='otimo'
      ? `✓ Acima da meta (${meta}%)`
      : ritmo==='medio'
      ? `⚡ Proximo da meta`
      : `↓ Abaixo da meta (${meta}%)`;

    return `
    <div class="op-card" style="--c:${col}">
      <div class="op-card-head">
        <div class="op-info">
          <div class="op-code">Op. ${s.op}</div>
          <div class="op-name">${op.name}</div>
        </div>
        <div class="op-card-right">
          <div class="op-rank">#${i+1}</div>
          <span class="alert-pill ${alertCls}">${alertLabel}</span>
        </div>
      </div>
      <div class="op-body">
        <div class="op-k">Caixas</div>       <div class="op-v">${s.caixas}</div>
        <div class="op-k">Rendimento</div>   <div class="op-v rend-v">${fmtPct(s.avgRd)}&nbsp;<span class="${trendCls}">${trendSymbol}</span></div>
        <div class="op-k">Intervalo</div>    <div class="op-v">${fmtMins(s.avgIntvl)}</div>
        <div class="op-k">Cx/Hora</div>      <div class="op-v">${s.cxh.toFixed(1)}</div>
        <div class="op-k">Kg entrada</div>   <div class="op-v">${fmtKg(s.sumPi)}</div>
        <div class="op-k">Kg saida</div>     <div class="op-v">${fmtKg(s.sumPf)}</div>
        <div class="op-k">Residuo</div>      <div class="op-v">${fmtKg(s.sumRes)}</div>
        <div class="op-k">Ult. apont.</div>  <div class="op-v">${s.lastHora}</div>
      </div>
      <div class="op-footer">
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill ${fillCls}" style="width:${pct.toFixed(1)}%"></div>
          </div>
          <span class="progress-pct">${fmtPct(s.avgRd)}</span>
        </div>
        <span class="badge badge-${ritmo}">${rlabel}</span>
      </div>
    </div>`;
  }).join('');
}

function renderKPI(gs, rows, type, meta) {
  const stats = opStats(rows, type);
  const best  = stats.length ? [...stats].sort((a,b)=>b.avgRd-a.avgRd)[0] : null;
  const aboveMeta = stats.filter(s=>s.avgRd>=meta).length;
  const strip = document.getElementById('kpi-strip');
  const kpis  = [
    {label:'Total Caixas',  val:`<span class="kv-blue" style="font-size:28px">${gs.total}</span>`,   sub:'caixas'},
    {label:'Operadores',    val:`<span class="kv-purple" style="font-size:28px">${gs.ops}</span>`,    sub:'ativos'},
    {label:'Acima da Meta', val:`<span style="font-size:26px;color:${aboveMeta===gs.ops?'#4caf50':'#ff8f00'}">${aboveMeta}/${gs.ops}</span>`, sub:`meta ${meta}%`},
    {label:'Rendimento',    val:`<span class="kv-yellow">${fmtPct(gs.ovRd)}</span>`,                  sub:'geral'},
    {label:'Peso Entrada',  val:`<span class="kv-blue">${fmtKg(gs.sumPi)}</span>`,                   sub:'total bruto'},
    {label:'Peso Saida',    val:`<span class="kv-orange">${fmtKg(gs.sumPf)}</span>`,                  sub:'total liquido'},
    {label:'Residuo',       val:`<span class="kv-cyan">${fmtKg(gs.sumRes)}</span>`,                   sub:'total'},
    {label:'Intervalo Med', val:`<span class="kv-orange">${fmtMins(gs.avgI)}</span>`,                 sub:'entre caixas'},
    {label:'Cx/Hora',       val:`<span class="kv-blue">${gs.cxh.toFixed(1)}</span>`,                  sub:'media geral'},
    best ? {label:'Melhor Op.',val:`<div class="kpi-best"><div class="kpi-best-op">Op.${best.op}</div><div class="kpi-best-rend">${fmtPct(best.avgRd)}</div></div>`,sub:OPS[best.op]?.name||''} : null,
  ].filter(Boolean);

  strip.innerHTML = kpis.map(k=>`
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      ${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}
    </div>`).join('');
}

/* resize */
let resizeTmr;
window.addEventListener('resize', () => {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(render, 180);
});

/* ── INIT ── */
populateFilters();
render();
fetchData().then(() => startAutoRefresh());
</script>
